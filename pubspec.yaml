name: servipopapp
description: "A new Flutter project."
publish_to: 'none' # Evita la publicación accidental a pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.4
  dio: ^5.8.0+1
  provider: ^6.1.2
  carousel_slider: ^5.0.0
  flutter_staggered_animations: ^1.1.1
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  intl_translation: ^0.20.1
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.2
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.11.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  intl: any
  http_parser: any
  get: ^4.7.2
  lottie: ^3.3.1
  flutter_rating_bar: ^4.0.1
  firebase_core: ^3.13.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.0.0
  pusher_channels_flutter: ^2.4.0
  webview_flutter: ^4.10.0
  app_links: ^6.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/flags/espana.png
    - assets/flags/reino.png
    - assets/images/
    - assets/animations/

# Configuración de flutter_native_splash (debe estar al mismo nivel que "flutter:")
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  branding: assets/images/logo.png
  color_dark: "#121212"
  image_dark: assets/images/logo.png
  branding_dark: assets/images/logo.png

  android_12:
    image: assets/images/logo.png
    icon_background_color: "#ffffff"
    image_dark: assets/images/logo.png
    icon_background_color_dark: "#121212"

  web: false